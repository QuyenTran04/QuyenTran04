<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12" />
      <stop offset="50%" stop-color="#071426" />
      <stop offset="100%" stop-color="#0d1b30" />
    </linearGradient>
    
    <!-- Glassmorphic Gradients -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.15" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="55" result="blur" />
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="65" result="blur" />
    </filter>
    
    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="300" rx="14" fill="url(#bg-grad)" />

  <!-- Background Glowing Orbs (Depth) -->
  <circle cx="120" cy="150" r="80" fill="#00f0ff" opacity="0.14" filter="url(#glow-cyan)" />
  <circle cx="680" cy="150" r="90" fill="#0d7cff" opacity="0.16" filter="url(#glow-blue)" />

  <!-- Glass Card Panel -->
  <rect x="30" y="25" width="740" height="250" rx="16" fill="url(#glass-grad)" stroke="url(#border-grad)" stroke-width="1.2" filter="url(#drop-shadow)" />

  <!-- Accent Top Border -->
  <path d="M 46 25 L 754 25" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" stroke-linecap="round" />

  <!-- Title of Board -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="400" y="52" font-size="14" font-weight="800" fill="#00f0ff" letter-spacing="3px">TECHNICAL CAPABILITIES</text>
    <line x1="360" y1="60" x2="440" y2="60" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6" />
  </g>

  <!-- Content Group -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#e2e8f0" text-anchor="middle">
    
    <!-- ================= COLUMN 1: LANGUAGES ================= -->
    <g transform="translate(100, 0)">
      <!-- Title -->
      <text x="0" y="88" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1px">LANGUAGES</text>
      <!-- JavaScript -->
      <g transform="translate(-55, 102)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">JavaScript</text>
      </g>
      <!-- Java -->
      <g transform="translate(-55, 134)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">Java</text>
      </g>
      <!-- HTML & CSS -->
      <g transform="translate(-55, 166)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">HTML &amp; CSS</text>
      </g>
    </g>

    <!-- ================= COLUMN 2: FRONTEND ================= -->
    <g transform="translate(250, 0)">
      <!-- Title -->
      <text x="0" y="88" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1px">FRONTEND</text>
      <!-- React -->
      <g transform="translate(-55, 102)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">React</text>
      </g>
      <!-- Bootstrap -->
      <g transform="translate(-55, 134)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">Bootstrap</text>
      </g>
      <!-- Responsive Design -->
      <g transform="translate(-55, 166)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">Responsive Design</text>
      </g>
    </g>

    <!-- ================= COLUMN 3: BACKEND ================= -->
    <g transform="translate(400, 0)">
      <!-- Title -->
      <text x="0" y="88" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1px">BACKEND</text>
      <!-- Node.js -->
      <g transform="translate(-55, 102)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">Node.js</text>
      </g>
      <!-- Express.js -->
      <g transform="translate(-55, 134)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">Express.js</text>
      </g>
      <!-- Spring Boot -->
      <g transform="translate(-55, 166)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">Spring Boot</text>
      </g>
    </g>

    <!-- ================= COLUMN 4: DATABASES ================= -->
    <g transform="translate(550, 0)">
      <!-- Title -->
      <text x="0" y="88" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1px">DATABASES</text>
      <!-- MongoDB -->
      <g transform="translate(-55, 102)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">MongoDB</text>
      </g>
      <!-- MySQL -->
      <g transform="translate(-55, 134)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">MySQL</text>
      </g>
    </g>

    <!-- ================= COLUMN 5: TOOLS & AUTO ================= -->
    <g transform="translate(700, 0)">
      <!-- Title -->
      <text x="0" y="88" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1px">TOOLS &amp; AUTO</text>
      <!-- n8n (Highlighted) -->
      <g transform="translate(-55, 102)">
        <rect width="110" height="22" rx="8" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1" />
        <text x="55" y="14" font-weight="700" fill="#00f0ff">n8n</text>
      </g>
      <!-- Git & GitHub -->
      <g transform="translate(-55, 134)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">Git &amp; GitHub</text>
      </g>
      <!-- Docker -->
      <g transform="translate(-55, 166)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">Docker</text>
      </g>
      <!-- Postman / VS Code -->
      <g transform="translate(-55, 198)">
        <rect width="110" height="22" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="55" y="14">Postman &amp; IDEs</text>
      </g>
    </g>

  </g>
</svg>
