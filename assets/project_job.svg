<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12" />
      <stop offset="100%" stop-color="#0b1b35" />
    </linearGradient>
    
    <!-- Glassmorphic Gradients -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.15" />
    </linearGradient>
    
    <!-- Filters for Glow -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    
    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="380" height="200" rx="14" fill="url(#bg-grad)" />

  <!-- Background Glowing Orbs (Depth) -->
  <circle cx="60" cy="140" r="50" fill="#00f0ff" opacity="0.15" filter="url(#glow-cyan)" />
  <circle cx="320" cy="60" r="60" fill="#0d7cff" opacity="0.18" filter="url(#glow-blue)" />

  <!-- Glass Card Panel -->
  <rect x="15" y="15" width="350" height="170" rx="12" fill="url(#glass-grad)" stroke="url(#border-grad)" stroke-width="1.2" filter="url(#drop-shadow)" />

  <!-- Accent Top Border -->
  <path d="M 27 15 L 353 15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" stroke-linecap="round" />

  <!-- Content Group -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- Title -->
    <text x="35" y="45" font-size="15" font-weight="700" fill="#ffffff">Job Management System</text>
    
    <!-- Role/Badge -->
    <rect x="35" y="60" width="138" height="16" rx="8" fill="rgba(0, 240, 255, 0.1)" />
    <text x="43" y="72" font-size="9" font-weight="700" fill="#00f0ff" letter-spacing="0.5px">BACKEND &amp; AI COLLAB</text>

    <!-- Description -->
    <text x="35" y="96" font-size="11" fill="#94a3b8" font-weight="400">Multi-role recruitment platform.</text>
    <text x="35" y="112" font-size="11" fill="#94a3b8" font-weight="400">Features CV matching &amp; workflow pipelines.</text>

    <!-- Tech Tag Capsules -->
    <!-- Tag 1: Java -->
    <g transform="translate(35, 134)">
      <rect width="42" height="20" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="21" y="14" font-size="9.5" fill="#e2e8f0" font-weight="500" text-anchor="middle">Java</text>
    </g>

    <!-- Tag 2: Spring Boot -->
    <g transform="translate(83, 134)">
      <rect width="72" height="20" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="36" y="14" font-size="9.5" fill="#e2e8f0" font-weight="500" text-anchor="middle">Spring Boot</text>
    </g>

    <!-- Tag 3: MySQL -->
    <g transform="translate(161, 134)">
      <rect width="52" height="20" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="26" y="14" font-size="9.5" fill="#e2e8f0" font-weight="500" text-anchor="middle">MySQL</text>
    </g>

    <!-- Tag 4: Docker -->
    <g transform="translate(219, 134)">
      <rect width="52" height="20" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="26" y="14" font-size="9.5" fill="#e2e8f0" font-weight="500" text-anchor="middle">Docker</text>
    </g>

  </g>
</svg>
