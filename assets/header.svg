<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#0f3460" />
    </linearGradient>
    
    <!-- Glassmorphic Gradients -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.2" />
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Filters for Glow & Blur -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>
    
    <!-- Text Shadow Filter -->
    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="220" rx="12" fill="url(#bg-grad)" />

  <!-- Background Glowing Orbs (Glass Depth) -->
  <circle cx="160" cy="80" r="90" fill="#00f0ff" opacity="0.22" filter="url(#glow-cyan)" />
  <circle cx="640" cy="140" r="100" fill="#0d7cff" opacity="0.25" filter="url(#glow-blue)" />

  <!-- Glass Card -->
  <rect x="40" y="30" width="720" height="160" rx="16" fill="url(#glass-grad)" stroke="url(#border-grad)" stroke-width="1.2" filter="url(#drop-shadow)" />

  <!-- Glass Card Highlight Glow (Subtle Top Border Accent) -->
  <path d="M 56 30 L 744 30" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-linecap="round" />

  <!-- Content -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Title -->
    <text x="400" y="95" font-size="34" font-weight="800" letter-spacing="4px" fill="url(#text-grad)" filter="url(#drop-shadow)">TRẦN A QUYỀN</text>
    
    <!-- Divider Line -->
    <line x1="300" y1="112" x2="500" y2="112" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Subtitle -->
    <text x="400" y="142" font-size="14" font-weight="500" letter-spacing="2px" fill="#94a3b8">INFORMATION TECHNOLOGY STUDENT</text>
    <text x="400" y="166" font-size="13" font-weight="600" letter-spacing="1.5px" fill="#00f0ff">FULL-STACK WEB DEVELOPER</text>
  </g>
</svg>
